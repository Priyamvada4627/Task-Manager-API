<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tasklog — Task Manager</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --panel-2: #1d212c;
    --border: #2a2f3d;
    --text: #e8eaf0;
    --text-dim: #8b91a3;
    --accent: #5eead4;
    --accent-dim: #2dd4bf;
    --danger: #fb7185;
    --warn: #fbbf24;
    --ok: #4ade80;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── Layout ──────────────────────────────────────────── */
  .app { display: none; }
  .app.active { display: block; }

  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.02em;
  }

  .brand .dot {
    width: 10px; height: 10px;
    background: var(--accent);
    border-radius: 2px;
    display: inline-block;
  }

  .user-pill {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .role-badge {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .role-badge.admin { background: rgba(251,191,36,0.15); color: var(--warn); border: 1px solid rgba(251,191,36,0.3); }
  .role-badge.user { background: rgba(94,234,212,0.1); color: var(--accent); border: 1px solid rgba(94,234,212,0.25); }

  .btn {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn:hover { border-color: var(--accent-dim); color: var(--accent); }
  .btn.primary {
    background: var(--accent);
    color: #0a0e12;
    border-color: var(--accent);
  }
  .btn.primary:hover { background: var(--accent-dim); color: #0a0e12; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Auth screen ─────────────────────────────────────── */
  #authScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .auth-card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px;
  }

  .auth-card h1 {
    font-family: var(--mono);
    font-size: 22px;
    margin-bottom: 4px;
    letter-spacing: -0.02em;
  }
  .auth-card .sub {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 28px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    background: var(--panel-2);
    border-radius: 8px;
    padding: 4px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    transition: all 0.15s;
  }
  .tab.active { background: var(--accent); color: #0a0e12; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent-dim);
  }
  .field textarea { resize: vertical; min-height: 70px; }

  .auth-card .btn.primary { width: 100%; padding: 11px; font-size: 14px; margin-top: 8px; }

  .hint {
    margin-top: 18px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
  }

  /* ── Alerts ──────────────────────────────────────────── */
  .alert {
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
    border: 1px solid transparent;
  }
  .alert.show { display: block; }
  .alert.error { background: rgba(251,113,133,0.1); color: var(--danger); border-color: rgba(251,113,133,0.3); }
  .alert.success { background: rgba(74,222,128,0.1); color: var(--ok); border-color: rgba(74,222,128,0.3); }

  /* ── Dashboard ───────────────────────────────────────── */
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .toolbar h2 {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
  }

  .filters {
    display: flex;
    gap: 8px;
  }
  .filters select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--mono);
  }

  /* New task form */
  .new-task-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .new-task-card h3 {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 14px;
  }
  .form-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr auto;
    gap: 10px;
    align-items: end;
  }
  @media (max-width: 800px) {
    .form-row { grid-template-columns: 1fr 1fr; }
  }

  /* Task list */
  .task-list { display: flex; flex-direction: column; gap: 10px; }

  .task-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color 0.15s;
  }
  .task-card:hover { border-color: #3a4053; }

  .task-card.completed { opacity: 0.55; }
  .task-card.completed .task-title { text-decoration: line-through; }

  .task-main { flex: 1; min-width: 0; }
  .task-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .task-desc { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  .badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border: 1px solid var(--border);
    color: var(--text-dim);
    white-space: nowrap;
  }
  .badge.status-pending { color: var(--text-dim); }
  .badge.status-in-progress { color: var(--warn); border-color: rgba(251,191,36,0.3); }
  .badge.status-completed { color: var(--ok); border-color: rgba(74,222,128,0.3); }
  .badge.priority-high { color: var(--danger); border-color: rgba(251,113,133,0.3); }
  .badge.priority-medium { color: var(--warn); border-color: rgba(251,191,36,0.3); }
  .badge.priority-low { color: var(--accent); border-color: rgba(94,234,212,0.25); }

  .task-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .task-actions select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-family: var(--mono);
  }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
  }
  .icon-btn:hover { border-color: var(--danger); color: var(--danger); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state .glyph { font-size: 32px; margin-bottom: 12px; font-family: var(--mono); }
  .empty-state p { font-size: 13px; }

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-top: 20px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }

  footer {
    text-align: center;
    padding: 20px;
    color: var(--text-dim);
    font-size: 11px;
    font-family: var(--mono);
  }
  footer a { color: var(--accent); text-decoration: none; }

  .owner-tag {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<!-- ══════════════ AUTH SCREEN ══════════════ -->
<div id="authScreen">
  <div class="auth-card">
    <h1>// tasklog</h1>
    <p class="sub">JWT-authenticated task manager — demo client</p>

    <div class="tabs">
      <div class="tab active" data-tab="login">Log in</div>
      <div class="tab" data-tab="register">Register</div>
    </div>

    <div id="authAlert" class="alert"></div>

    <!-- Login form -->
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn primary">Log in</button>
    </form>

    <!-- Register form -->
    <form id="registerForm" style="display:none;">
      <div class="field">
        <label>Name</label>
        <input type="text" id="regName" required placeholder="Jane Doe" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="regPassword" required placeholder="At least 6 chars + a number" />
      </div>
      <button type="submit" class="btn primary">Create account</button>
    </form>

    <div class="hint">
      Default admin (after running <code>npm run seed</code>):<br/>
      admin@example.com / Admin123!
    </div>
  </div>
</div>

<!-- ══════════════ DASHBOARD ══════════════ -->
<div id="app" class="app">
  <header>
    <div class="brand"><span class="dot"></span> tasklog</div>
    <div class="user-pill">
      <span id="userName"></span>
      <span id="userRole" class="role-badge"></span>
      <button class="btn" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main>
    <div id="dashAlert" class="alert"></div>

    <!-- New task -->
    <div class="new-task-card">
      <h3>New task</h3>
      <form id="newTaskForm">
        <div class="form-row">
          <div class="field" style="margin-bottom:0;">
            <label>Title</label>
            <input type="text" id="newTitle" required placeholder="What needs doing?" />
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>Priority</label>
            <select id="newPriority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>Due date</label>
            <input type="date" id="newDueDate" />
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>Status</label>
            <select id="newStatus">
              <option value="pending" selected>Pending</option>
              <option value="in-progress">In progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <button type="submit" class="btn primary">Add</button>
        </div>
        <div class="field" style="margin-top:10px; margin-bottom:0;">
          <input type="text" id="newDescription" placeholder="Description (optional)" />
        </div>
      </form>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <h2 id="listTitle">Your tasks</h2>
      <div class="filters">
        <select id="filterStatus">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="in-progress">In progress</option>
          <option value="completed">Completed</option>
        </select>
        <select id="filterPriority">
          <option value="">All priorities</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        <button class="btn" id="refreshBtn">Refresh</button>
      </div>
    </div>
    <div id="adminPanel" class="new-task-card" style="display:none;">
      <h3>Admin Panel - User Management</h3>
      <button class="btn" id="refreshUsersBtn">Refresh Users</button>
      <div id="usersTable" style="margin-top:15px;"></div>
    </div>
    <div id="taskList" class="task-list"></div>
    <div id="pagination" class="pagination"></div>
  </main>

  <footer>
    Tasklog demo &middot; API docs at <a href="/docs" target="_blank">/docs</a>
  </footer>
</div>

<script>
const API_BASE = '/api/v1';
let state = {
  accessToken: localStorage.getItem('accessToken') || null,
  refreshToken: localStorage.getItem('refreshToken') || null,
  user: JSON.parse(localStorage.getItem('user') || 'null'),
  page: 1,
};

// ── Helpers ──────────────────────────────────────────────────────
function showAlert(elId, message, type = 'error') {
  const el = document.getElementById(elId);
  el.textContent = message;
  el.className = `alert show ${type}`;
  setTimeout(() => el.classList.remove('show'), 4000);
}

async function apiFetch(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (state.accessToken) headers['Authorization'] = `Bearer ${state.accessToken}`;

  let res = await fetch(API_BASE + path, { ...options, headers });

  // Try refreshing token on 401
  if (res.status === 401 && state.refreshToken && path !== '/auth/refresh') {
    const refreshed = await tryRefreshToken();
    if (refreshed) {
      headers['Authorization'] = `Bearer ${state.accessToken}`;
      res = await fetch(API_BASE + path, { ...options, headers });
    }
  }

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.message || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

async function tryRefreshToken() {
  try {
    const res = await fetch(API_BASE + '/auth/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refreshToken: state.refreshToken }),
    });
    if (!res.ok) return false;
    const data = await res.json();
    state.accessToken = data.data.access_token;
    state.refreshToken = data.data.refresh_token || state.refreshToken;

    localStorage.setItem('accessToken', state.accessToken);
    localStorage.setItem('refreshToken', state.refreshToken);
    return true;
  } catch {
    return false;
  }
}

// ── Auth tab switching ──────────────────────────────────────────
document.querySelectorAll('.tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
    tab.classList.add('active');
    const isLogin = tab.dataset.tab === 'login';
    document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
    document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
  });
});

// ── Login ────────────────────────────────────────────────────────
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  try {
    const data = await apiFetch('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email, password }),
    });
    handleAuthSuccess(data.data);
  } catch (err) {
    showAlert('authAlert', err.message);
  }
});

// ── Register ─────────────────────────────────────────────────────
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  try {
    const data = await apiFetch('/auth/register', {
      method: 'POST',
      body: JSON.stringify({ name, email, password }),
    });
    handleAuthSuccess(data.data);
  } catch (err) {
    showAlert('authAlert', err.message);
  }
});

function handleAuthSuccess(data) {
  state.accessToken = data.access_token;
  state.refreshToken = data.refresh_token;
  state.user = data.user;

  localStorage.setItem('accessToken', data.access_token);
  localStorage.setItem('refreshToken', data.refresh_token);
  localStorage.setItem('user', JSON.stringify(data.user));

  enterDashboard();
}
// ── Logout ───────────────────────────────────────────────────────
document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.clear();

  document.getElementById('adminPanel').style.display = 'none';

  state = {
    accessToken: null,
    refreshToken: null,
    user: null,
    page: 1
  };

  document.getElementById('app').classList.remove('active');
  document.getElementById('authScreen').style.display = 'flex';
});
// ── Enter dashboard ──────────────────────────────────────────────
function enterDashboard() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');

  document.getElementById('userName').textContent = state.user.name;

  const roleBadge = document.getElementById('userRole');
  roleBadge.textContent = state.user.role;
  roleBadge.className = `role-badge ${state.user.role}`;

  document.getElementById('listTitle').textContent =
    state.user.role === 'admin'
      ? 'All tasks (admin view)'
      : 'Your tasks';

  // Hide first
  document.getElementById('adminPanel').style.display = 'none';

  // Show only for admins
  if (state.user.role === 'admin') {
    document.getElementById('adminPanel').style.display = 'block';
    loadUsers();
  }

  loadTasks();
}
// ── New task ─────────────────────────────────────────────────────
document.getElementById('newTaskForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = document.getElementById('newTitle').value.trim();
  const description = document.getElementById('newDescription').value.trim();
  const priority = document.getElementById('newPriority').value;
  const status = document.getElementById('newStatus').value;
  const dueDate = document.getElementById('newDueDate').value || null;

  try {
    await apiFetch('/tasks/', {
      method: 'POST',
      body: JSON.stringify({
        title,
        description,
        priority,
        status,
        due_date: dueDate
      }),
    });
    document.getElementById('newTaskForm').reset();
    showAlert('dashAlert', 'Task created', 'success');
    loadTasks();
  } catch (err) {
    showAlert('dashAlert', err.message);
  }
});

// ── Filters & refresh ────────────────────────────────────────────
document.getElementById('filterStatus').addEventListener('change', () => { state.page = 1; loadTasks(); });
document.getElementById('filterPriority').addEventListener('change', () => { state.page = 1; loadTasks(); });
document.getElementById('refreshBtn').addEventListener('click', loadTasks);

// ── Load tasks ───────────────────────────────────────────────────
async function loadTasks() {
  const status = document.getElementById('filterStatus').value;
  const priority = document.getElementById('filterPriority').value;
  const params = new URLSearchParams({ page: state.page, limit: 10 });
  if (status) params.set('status', status);
  if (priority) params.set('priority', priority);

  try {
    const data = await apiFetch(`/tasks/?${params.toString()}`);
    renderTasks(data.data.tasks);
    renderPagination(data.data.pagination);
  } catch (err) {
    showAlert('dashAlert', err.message);
  }
}

function renderTasks(tasks) {
  const list = document.getElementById('taskList');
  if (!tasks.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="glyph">[ ]</div>
        <p>No tasks here yet. Add one above to get started.</p>
      </div>`;
    return;
  }

  list.innerHTML = tasks.map((task) => `
    <div class="task-card ${task.status === 'completed' ? 'completed' : ''}" data-id="${task.id}">
      <div class="task-main">
        <div class="task-title">${escapeHtml(task.title)}</div>
        ${task.description ? `<div class="task-desc">${escapeHtml(task.description)}</div>` : ''}
        <div class="task-meta">
          <span class="badge status-${task.status}">${task.status}</span>
          <span class="badge priority-${task.priority}">${task.priority}</span>
          ${task.due_date ? `<span class="badge">due ${task.due_date}</span>` : ''}
          ${task.owner ? `<span class="owner-tag">— ${escapeHtml(task.owner.name)}</span>` : ''}
        </div>
      </div>
      <div class="task-actions">
        <select class="status-select" data-id="${task.id}">
          <option value="pending" ${task.status === 'pending' ? 'selected' : ''}>Pending</option>
          <option value="in-progress" ${task.status === 'in-progress' ? 'selected' : ''}>In progress</option>
          <option value="completed" ${task.status === 'completed' ? 'selected' : ''}>Completed</option>
        </select>
        <button class="icon-btn delete-btn" data-id="${task.id}" title="Delete task">✕</button>
      </div>
    </div>
  `).join('');

  // Status change handlers
  list.querySelectorAll('.status-select').forEach((sel) => {
    sel.addEventListener('change', async (e) => {
      const id = e.target.dataset.id;
      try {
        await apiFetch(`/tasks/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ status: e.target.value }),
        });
        showAlert('dashAlert', 'Task updated', 'success');
        loadTasks();
      } catch (err) {
        showAlert('dashAlert', err.message);
      }
    });
  });

  // Delete handlers
  list.querySelectorAll('.delete-btn').forEach((btn) => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.dataset.id;
      if (!confirm('Delete this task?')) return;
      try {
        await apiFetch(`/tasks/${id}`, { method: 'DELETE' });
        showAlert('dashAlert', 'Task deleted', 'success');
        loadTasks();
      } catch (err) {
        showAlert('dashAlert', err.message);
      }
    });
  });
}

function renderPagination(pagination) {
  const el = document.getElementById('pagination');
  if (!pagination || pagination.total_pages <= 1) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = `
    <button class="btn" id="prevPage" ${pagination.page <= 1 ? 'disabled' : ''}>&larr; Prev</button>
    <span>Page ${pagination.page} / ${pagination.total_pages} &middot; ${pagination.total} total</span>
    <button class="btn" id="nextPage" ${pagination.page >= pagination.total_pages ? 'disabled' : ''}>Next &rarr;</button>
  `;
  document.getElementById('prevPage')?.addEventListener('click', () => { state.page--; loadTasks(); });
  document.getElementById('nextPage')?.addEventListener('click', () => { state.page++; loadTasks(); });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
document.getElementById('refreshUsersBtn')?.addEventListener('click', loadUsers);

async function loadUsers() {
  try {
    const data = await apiFetch('/admin/users?page=1&limit=100');

    const users = data.data.users;

    document.getElementById('usersTable').innerHTML = `
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Update</th>
          </tr>
        </thead>
        <tbody>
          ${users.map(user => `
            <tr>
              <td>${escapeHtml(user.name)}</td>
              <td>${escapeHtml(user.email)}</td>
              <td>${user.role}</td>
              <td>
                <select onchange="changeRole('${user.id}', this.value)">
                  <option value="user" ${user.role === 'user' ? 'selected' : ''}>User</option>
                  <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>
                </select>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (err) {
    showAlert('dashAlert', err.message);
  }
}

async function changeRole(userId, role) {
  try {
    await apiFetch(`/admin/users/${userId}/role`, {
      method: 'PATCH',
      body: JSON.stringify({ role })
    });

    showAlert('dashAlert', 'Role updated successfully', 'success');
    loadUsers();
  } catch (err) {
    showAlert('dashAlert', err.message);
  }
}
// ── Init ─────────────────────────────────────────────────────────
if (state.accessToken && state.user) {
  enterDashboard();
}
</script>
